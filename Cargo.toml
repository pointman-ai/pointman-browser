[package]
name = "browser"
version = "0.1.7"
edition = "2021"
description = "agent-browser on Pointman's machines: agents drive a headless browser, each in its own session."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-browser"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.1" }
serde_json = "1"
sha2 = "0.10"
ureq = "2"

[dev-dependencies]
tempfile = "3"
toml = "0.8"

[profile.release]
strip = true
lto = true
