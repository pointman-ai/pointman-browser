# agent-browser (github.com/vercel-labs/agent-browser) on Pointman's machines: agents drive a headless Chrome on
# this machine (open, snapshot, click, type, screenshot), sent from anywhere with create_job(machine=…). A pinned
# agent-browser release, checked against the sha256 this extension carries, is installed in the extension's state
# folder, with the Chrome it downloads. Each agent has its own session: its tabs, cookies and refs are its own.
[extension]
id = "browser"
name = "Browser"
version = "0.1.8"
publisher = "aurelio"
summary = "Agents drive a headless browser with agent-browser: open pages, read them, click, type and take screenshots."
node = ">=0.4.0"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/browser"]
runtime = "binary"

# guidance for agents on a node with it: the loop, refs, test accounts only, stills as outputs
[behavior]
skill = "SKILLS.md"

[permissions]
secrets = ["browser.*"]    # the test logins James adds with /browser add: the extension signs in with them, the agent never sees them
network = true                   # agent-browser's pinned release and Chrome, once per version; and the pages agents open

# A test login: a sign-in page and a staging-only test account, plus a Cloudflare Access service token when the site
# sits behind Access. Each is a field of its own: the plain ones are shown as typed, and the apps seal them as one
# vault record {"kind":"env","vars":{...}} that the extension reads. It sends the Access headers to that one origin
# and types the password itself.
[[credentials]]
id = "login"
title = "Test login"
help = "Access only for a site behind Cloudflare Access."
item = "browser.{label}"
needed = 0

[[credentials.fields]]
name = "URL"
title = "Sign-in page"
value = 'https://\S+'
placeholder = "https://"
plain = true
optional = false

[[credentials.fields]]
name = "EMAIL"
title = "Test account email"
plain = true
optional = false

[[credentials.fields]]
name = "PASSWORD"
title = "Password"
plain = false
optional = false

[[credentials.fields]]
name = "ACCESS_CLIENT_ID"
title = "Cloudflare Access client ID"
plain = true
optional = true

[[credentials.fields]]
name = "ACCESS_CLIENT_SECRET"
title = "Cloudflare Access client secret"
plain = false
optional = true

[settings]
type = "object"

[settings.properties.headed]
type = "boolean"
title = "Visible window"
default = false
description = "Let agents ask for a visible browser window (--headed) on this machine's screen. Off: headless only."

[settings.properties.chrome]
type = "string"
title = "Chrome or Chromium"
default = ""
description = "Path to a browser to use instead of the one agent-browser downloads. Empty is fine: on NixOS the extension builds its own Chromium (nix build nixpkgs#chromium) into its state folder; elsewhere on Linux a chromium on the PATH is used."

[settings.properties.lock]
type = "string"
title = "Heavy-job lock script"
default = ""
description = "A script (like ~/lane/heavy.sh) with `take <holder> <job>` and `release <holder>`. A test run holds the machine's heavy-job lane from browser.test_start to browser.test_finish. Empty: no lock."

[[commands]]
kind = "browser.add"
title = "Add a test login"
params = { type = "object", properties = { name = { type = "string", description = "What to call it (stagesheep): lowercase letters, digits, . _ -" } } }
slash = "add"
form = "login"
summary = "Add a test login for a site: its URL, Access token, and test account"

[[commands]]
kind = "browser.run"
title = "Run agent-browser (args, agent, doing?)"
params = { type = "object", properties = { args = { type = "array", items = { type = "string" }, description = "The words after `agent-browser`: [\"open\", \"https://example.com\"], then [\"snapshot\", \"-i\", \"-c\"], [\"click\", \"@e1\"], [\"fill\", \"@e2\", \"text\"], [\"screenshot\"]" }, agent = { type = "string", description = "Your handle: your own browser session on this machine is named for it" }, doing = { type = "string", description = "What you're doing, in a few words" }, timeout = { type = "integer", minimum = 1, maximum = 600, default = 60, description = "Seconds before it's stopped" }, login = { type = "string", description = "The label of a test login James added with `/browser add`: the extension signs your session in first, and you never see its values" } }, required = ["args", "agent"], additionalProperties = false }
cancellable = true
outputs = ["image", "document"]
slash = "run"
summary = "Any agent-browser command in your own session: open a page, snapshot it, click, type, screenshot"

[[commands]]
kind = "browser.status"
title = "agent-browser here: version, Chrome, sessions"
params = { type = "object", properties = {}, additionalProperties = false }
slash = "status"
summary = "agent-browser's version on this machine, the Chrome it uses, and the open sessions"

[[commands]]
kind = "browser.test_start"
title = "Start a UI test run (name, checklist, agent)"
params = { type = "object", properties = { name = { type = "string", description = "What the run is called: \"Spacesheep staging: sign in\"" }, checklist = { type = "string", description = "Markdown: one step per `- ` line, with an optional indented `expect: …` line under a step" }, agent = { type = "string", description = "Your handle: the run uses your browser session on this machine" }, login = { type = "string", description = "The label of a test login James added with `/browser add`: the run starts with your session signed in" } }, required = ["name", "checklist", "agent"], additionalProperties = false }
cancellable = true
slash = "test-start"
summary = "Start a checklist run on this machine; holds its heavy-job lane until test_finish"

[[commands]]
kind = "browser.test_step"
title = "Record one step of a run (run, step, ok, note?)"
params = { type = "object", properties = { run = { type = "string", description = "The id browser.test_start gave" }, step = { type = "integer", minimum = 1, description = "The step's number in the checklist, from 1" }, ok = { type = "boolean", description = "Did the step do what its line and its expect say" }, note = { type = "string", description = "What you saw, in a sentence; for a failure, what went wrong" }, shot = { type = "boolean", default = true, description = "Take a still of your browser session now" }, file = { type = "string", description = "A PNG or JPEG on this machine to use as the still instead, such as desktop's screenshot of a Mac app" } }, required = ["run", "step", "ok"], additionalProperties = false }
cancellable = true
outputs = ["image"]
slash = "test-step"
summary = "Record a step's result with a still of the browser, or of a file you give"

[[commands]]
kind = "browser.test_finish"
title = "Finish a run and make its report (run)"
params = { type = "object", properties = { run = { type = "string", description = "The id browser.test_start gave" } }, required = ["run"], additionalProperties = false }
outputs = ["document"]
slash = "test-finish"
summary = "Write report.html, a still for every step, pass or fail; let go of the heavy-job lane"
